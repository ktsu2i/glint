# ローカル開発と CI (release workflow) で使う toolchain を固定する。
# frontend/package.json の devEngines、README の前提条件と揃えること。
[tools]
go = "1.27.4"
node = "26.13.1"
pnpm = "12.21.0"
"go:github.com/wailsapp/wails/v2/cmd/wails" = "2.17.1"

# GitHub Actions workflow の lint (.github/workflows/lint-actions.yaml でも同じ版を使う)。
# actionlint は run: の script 検査に shellcheck を使う。
actionlint = "1.7.12"
jactionlint = "2.6.0"
ghalint = "1.6.0"
zizmor = "1.33.1"
shellcheck = "0.11.0"
