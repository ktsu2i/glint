name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go for bindings
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Generate frontend bindings
        run: go tool wails3 generate bindings -ts -i -f '-tags=server'

      - name: Set up pnpm and Node.js, install dependencies
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          working-directory: frontend
          cache: true
          require-lockfile: true

      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Format check
        working-directory: frontend
        run: pnpm format:check

      - name: Unused code check
        working-directory: frontend
        run: pnpm knip

  go-lint:
    name: Go lint
    runs-on: macos-15
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up golangci-lint (aqua.yaml)
        uses: aquaproj/aqua-installer@b8be739961814ee66b9e0d505f4d5de0d2eff047 # v4.1.2
        with:
          aqua_version: v2.66.1

      - name: Run golangci-lint
        run: golangci-lint run ./...

      - name: Format check
        run: golangci-lint fmt --diff ./...

      # sqlc は go.mod の tool directive で固定している。生成コードが queries / migrations と一致するか確認する。
      - name: Check sqlc generated code
        run: go tool sqlc diff
