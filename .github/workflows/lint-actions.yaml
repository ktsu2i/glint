name: Lint GitHub Actions

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: actionlint / jactionlint / ghalint / zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # aqua.yaml の版で lint 用の tool を入れる。aqua-checksums.json で検証する。
      - name: Set up lint tools (aqua.yaml)
        uses: aquaproj/aqua-installer@b8be739961814ee66b9e0d505f4d5de0d2eff047 # v4.1.2
        with:
          aqua_version: v2.66.1

      - name: Run actionlint
        run: actionlint

      - name: Run jactionlint
        run: jactionlint

      - name: Run ghalint
        run: ghalint run

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .
