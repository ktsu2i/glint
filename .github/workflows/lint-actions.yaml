name: Lint GitHub Actions

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: actionlint / jactionlint / ghalint / zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # lint 用の tool だけを mise.toml の版で入れる。release workflow と cache key を
      # 共有して不完全な tool set を cache しないよう、cache は使わない。
      - name: Set up lint tools (mise.toml)
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: actionlint jactionlint ghalint zizmor shellcheck
          cache: false

      - name: Run actionlint
        run: actionlint

      - name: Run jactionlint
        run: jactionlint

      - name: Run ghalint
        run: ghalint run

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .
