name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go test
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        run: go test ./...

      - name: Set up pnpm and Node.js for app build
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          working-directory: frontend
          cache: true
          install: false

      - name: Build universal macOS app
        run: go tool wails3 task build ARCH=universal
  frontend-test:
    name: Frontend test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go for bindings
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Linux では wails3 CLI が cgo で gtk4 / webkitgtk に link しようとするので cgo を切る。
      # bindings は静的解析なので、server tag と合わせて macOS で生成したものと一致する。
      - name: Generate frontend bindings
        env:
          CGO_ENABLED: "0"
        run: go tool wails3 generate bindings -ts -i -f '-tags=server'

      - name: Set up pnpm and Node.js, install dependencies
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          working-directory: frontend
          cache: true
          require-lockfile: true

      - name: Run tests
        working-directory: frontend
        run: pnpm test
