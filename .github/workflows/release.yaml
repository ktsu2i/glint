name: Release

# main への push ごとに release-please がリリース PR を作成・更新する。
# リリース PR を merge すると tag と GitHub Release が作られ、同じ workflow で
# macOS app をビルドして asset を添付する。GITHUB_TOKEN で作った tag は別の
# workflow を起動しないため、ビルドもこの workflow 内で行う。
on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  build:
    name: Build and attach macOS app
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up toolchain (mise.toml)
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: true

      - name: Check version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected release version: ${VERSION}"
            exit 1
          fi
          # Info.plist の CFBundleShortVersionString は wails.json の productVersion から入る。
          # release-please が extra-files で更新しているはずなので、ずれていたら止める。
          product_version="$(jq -r '.info.productVersion' wails.json)"
          if [[ "$product_version" != "$VERSION" ]]; then
            echo "::error::wails.json productVersion (${product_version}) does not match ${VERSION}"
            exit 1
          fi
          echo "ASSET=Glint-${VERSION}-darwin-universal.zip" >> "$GITHUB_ENV"

      - name: Build universal app
        env:
          # Go 1.27 は macOS 13 以上が前提。cgo 部分の deployment target も揃える。
          CGO_CFLAGS: -mmacosx-version-min=13.0
          CGO_LDFLAGS: -mmacosx-version-min=13.0
        run: wails build -platform darwin/universal -clean

      - name: Package app
        run: |
          ditto -c -k --keepParent build/bin/Glint.app "$ASSET"
          shasum -a 256 "$ASSET" > "$ASSET.sha256"

      - name: Attach assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
