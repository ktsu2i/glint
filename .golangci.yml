# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
# golangci-lint の設定 (https://golangci-lint.run/docs/configuration/file/)
# 版は aqua.yaml で固定している。CI (.github/workflows/lint.yaml) も同じ版を使う。
version: "2"

linters:
  # standard (errcheck, govet, ineffassign, staticcheck, unused) に加えて有効にする。
  enable:
    - bodyclose
    - copyloopvar
    - errname
    - errorlint
    - gocritic
    - intrange
    - misspell
    - modernize
    - noctx
    - nolintlint
    - perfsprint
    - rowserrcheck
    - sqlclosecheck
    - testifylint
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    staticcheck:
      checks:
        - all
        # 公開 API の doc comment は必須にしない。
        - -ST1000
        - -ST1020
        - -ST1021
        - -ST1022
        # request DTO と保存用の型は別物として明示的に詰め替える。
        - -S1016
    testifylint:
      disable:
        # 失敗後も残りの assert を見たい場面があるので require を強制しない。
        - require-error

issues:
  # 同種の指摘を省略せず全件表示する。
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kaito/glint
