version: "2"

linters:
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - errname
    - errorlint
    - forbidigo
    - gocritic
    - intrange
    - misspell
    - modernize
    - noctx
    - nolintlint
    - perfsprint
    - rowserrcheck
    - sqlclosecheck
    - testifylint
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
  settings:
    depguard:
      # Enforce the dependency direction described in AGENTS.md:
      # main.go -> internal/app -> feature packages -> internal/library -> internal/sqlite
      rules:
        wails-boundary:
          list-mode: lax
          files:
            - "**/internal/**"
            - "**/migrations/**"
            - "!**/internal/app/**"
          deny:
            - pkg: github.com/ktsu2i/glint/internal/app
              desc: only main.go may import internal/app
            - pkg: github.com/wailsapp/wails/v3/pkg/application
              desc: only main.go and internal/app may import Wails application
            - pkg: github.com/wailsapp/wails/v3/pkg/events
              desc: only main.go and internal/app may import Wails events
        features:
          list-mode: lax
          files:
            - "**/internal/books/**"
            - "**/internal/settings/**"
          deny:
            - pkg: github.com/wailsapp/wails
              desc: feature packages must not depend on Wails
            - pkg: github.com/ktsu2i/glint/internal/assetserver
              desc: feature packages must not depend on the asset server
        library:
          list-mode: lax
          files:
            - "**/internal/library/**"
          allow:
            - github.com/ktsu2i/glint/internal/library
            - github.com/ktsu2i/glint/internal/sqlite
          deny:
            - pkg: github.com/ktsu2i/glint/internal
              desc: internal/library is the store and may only import internal/sqlite
        no-playwright-in-app:
          list-mode: lax
          files:
            - "**/main.go"
            - "**/internal/**"
            - "!**/cmd/**"
          deny:
            - pkg: github.com/mxschmitt/playwright-go
              desc: Playwright is only for cmd/verify-glint
        verify-tool:
          list-mode: lax
          files:
            - "**/cmd/verify-glint/**"
          deny:
            - pkg: github.com/ktsu2i/glint/internal
              desc: verify-glint drives the app from outside and must not import its packages
            - pkg: github.com/wailsapp/wails
              desc: verify-glint drives the app from outside and must not import Wails
        leaf-packages:
          list-mode: lax
          files:
            - "**/internal/assetserver/**"
            - "**/internal/sqlite/**"
            - "**/internal/update/**"
          deny:
            - pkg: github.com/ktsu2i/glint/internal
              desc: platform adapters and infrastructure must not import other internal packages
    forbidigo:
      forbid:
        - pattern: ^(t|b|tb)\.(Error|Errorf|Fatal|Fatalf|Fail|FailNow)$
          msg: use testify assert / require instead
    nolintlint:
      require-explanation: true
      require-specific: true
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1020
        - -ST1021
        - -ST1022
        - -S1016
    testifylint:
      disable:
        - require-error
    usetesting:
      context-background: true
      context-todo: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ktsu2i/glint
